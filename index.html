<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - FoodFresh AI</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-body">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                🥬
            </div>

            <h1>
                Welcome Back 👋
            </h1>

            <p class="auth-subtitle">
                Login to FoodFresh AI
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="primary-btn auth-btn"
                >
                    Login
                </button>

                <p
                    id="loginMessage"
                    class="auth-message">
                </p>

            </form>

            <div class="auth-footer">

                <p>
                    Don't have an account?
                </p>

                <a href="register.html">
                    Create an account
                </a>

            </div>

        </div>

    </div>

    <!-- ONLY script.js -->
    <script src="script.js"></script>

</body>

</html>

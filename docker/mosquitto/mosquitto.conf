# Development broker for the optional IoT sensor path.
# Anonymous access is enabled for local convenience ONLY - never do this on a
# broker reachable from an untrusted network. For anything shared, create a
# password file and set `allow_anonymous false`.
listener 1883
allow_anonymous true

# WebSocket listener (useful for browser-based MQTT debugging tools).
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
log_type error
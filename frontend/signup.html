<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fresh Monitor - Sign Up</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
                  url('https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
    }

    /* Header Navbar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 8%;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
      color: #4ade80;
      text-decoration: none;
    }

    .logo span {
      color: #ffffff;
      display: block;
      font-size: 0.75rem;
      letter-spacing: 1.5px;
    }

    .btn-back {
      color: #e5e7eb;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.3s;
    }

    .btn-back:hover {
      color: #4ade80;
    }

    /* Centered Container */
    .signup-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    /* Glassmorphism Card */
    .signup-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 35px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .signup-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 12px;
      background: rgba(0, 0, 0, 0.2);
    }

    .signup-header h2 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .signup-header p {
      font-size: 0.88rem;
      color: #d1d5db;
    }

    /* Form Layout */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: #e5e7eb;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      color: #9ca3af;
      font-size: 0.9rem;
    }

    .input-wrapper input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.3s, background 0.3s;
    }

    .input-wrapper input::placeholder {
      color: #9ca3af;
    }

    .input-wrapper input:focus {
      border-color: #4ade80;
      background: rgba(255, 255, 255, 0.15);
    }

    /* Terms Checkbox */
    .terms-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.82rem;
      color: #d1d5db;
      margin-bottom: 22px;
      line-height: 1.4;
    }

    .terms-group input {
      margin-top: 2px;
      accent-color: #4ade80;
      cursor: pointer;
    }

    .terms-group a {
      color: #4ade80;
      text-decoration: none;
    }

    .terms-group a:hover {
      text-decoration: underline;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background-color: #4ade80;
      color: #111827;
      padding: 12px;
      border: none;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.3s;
    }

    .btn-submit:hover {
      background-color: #22c55e;
    }

    /* Redirect Link */
    .login-text {
      text-align: center;
      font-size: 0.85rem;
      color: #d1d5db;
      margin-top: 20px;
    }

    .login-text a {
      color: #4ade80;
      text-decoration: none;
      font-weight: 600;
    }

    .login-text a:hover {
      text-decoration: underline;
    }

    /* Footer Bar */
    footer {
      background-color: #1a2a22;
      color: #9ca3af;
      padding: 15px 8%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 0.85rem;
    }

    .footer-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-item i {
      color: #4ade80;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <a href="index.html.html" class="logo">
      <i class="fa-solid fa-leaf"></i>
      <div>
        FRESH
        <span>MONITOR</span>
      </div>
    </a>
    <a href="index.html.html" class="btn-back">
      <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>
  </header>

  <!-- Sign Up Section -->
  <div class="signup-container">
    <div class="signup-card">
      <div class="signup-header">
        <div class="badge">
          <i class="fa-solid fa-wand-magic-sparkles"></i> JOIN US
        </div>
        <h2>Create an Account</h2>
        <p>Start tracking and reducing food waste today</p>
      </div>

      <form action="#" method="POST">
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-user"></i>
            <input type="text" id="fullname" placeholder="John Doe" required />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="email" placeholder="name@example.com" required />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="At least 8 characters" required />
          </div>
        </div>

        <div class="terms-group">
          <input type="checkbox" id="terms" required />
          <label for="terms">I agree to the <a href="Terms of Service.html">Terms of Service</a> and <a href="l.html">Privacy Policy</a></label>
        </div>

        <button type="submit" class="btn-submit">
          Create Account <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="login-text">
        Already have an account? <a href="signin.html.html">Log in</a>
      </div>
    </div>
  </div>

  <!-- Bottom Bar -->
  <footer>
    <div class="footer-item">
      <i class="fa-solid fa-shield-halved"></i>
      <span>Trusted by Thousands</span>
    </div>
    <div class="footer-item">
      <i class="fa-solid fa-bullseye"></i>
      <span>Accurate Predictions</span>
    </div>
    <div class="footer-item">
      <i class="fa-solid fa-heart"></i>
      <span>Healthy Future</span>
    </div>
  </footer>

</body>
</html>

</div>
<script src="auth.js"></script>
<script>
    let activeCategory = 'All';
    let activeSearch = '';
    let searchTimeout = null;

    function getStatusClass(status) {
        const s = (status || '').toLowerCase();
        if (s.includes('fresh')) return 'status-fresh';
        if (s.includes('good')) return 'status-good';
        if (s.includes('acceptable')) return 'status-acceptable';
        if (s.includes('near')) return 'status-near-spoilage';
        if (s.includes('spoil')) return 'status-spoiled';
        return 'status-good';
    }

    async function loadInventory() {
        const token = getAuthToken();
        if (!token) return;

        const countEl = document.getElementById('inventory-count');
        const gridEl = document.getElementById('inventory-grid');
        gridEl.innerHTML = '<div class="col-span-full py-12 text-center text-on-surface-variant font-body-md">Loading items from server...</div>';

        try {
            let url = `${API_BASE_URL}/inventory?limit=100`;
            if (activeCategory && activeCategory !== 'All') {
                url += `&category=${encodeURIComponent(activeCategory)}`;
            }
            if (activeSearch.trim()) {
                url += `&search=${encodeURIComponent(activeSearch.trim())}`;
            }

            const response = await fetch(url, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!response.ok) {
                gridEl.innerHTML = '<div class="col-span-full py-12 text-center text-error font-body-md">Failed to load inventory items.</div>';
                return;
            }

            const data = await response.json();
            countEl.textContent = `${data.total.toLocaleString()} item${data.total === 1 ? '' : 's'} currently tracked across all facilities.`;

            if (!data.items || data.items.length === 0) {
                gridEl.innerHTML = '<div class="col-span-full py-12 text-center text-on-surface-variant font-body-md">No inventory items found matching your filter.</div>';
                return;
            }

            gridEl.innerHTML = data.items.map(item => `
                <article onclick="window.location.href='item-details.html?id=${item.id}'" class="bg-surface-container-lowest rounded-card border border-surface-variant p-6 ambient-shadow hover:shadow-lg transition-shadow duration-300 group cursor-pointer flex flex-col h-full">
                    <div class="h-48 rounded-lg mb-4 overflow-hidden bg-surface-container">
                        <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="${item.image_url || 'https://via.placeholder.com/300'}" alt="${item.name}"/>
                    </div>
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-title-lg text-title-lg text-on-surface">${item.name}</h3>
                        <span class="px-3 py-1 rounded-full font-label-sm text-label-sm ${getStatusClass(item.freshness_status)}">${item.freshness_status}</span>
                    </div>
                    <p class="font-body-md text-body-md text-on-surface-variant mb-4">Lot: #${item.batch_id}</p>
                    <div class="mt-auto pt-4 border-t border-surface-variant flex justify-between items-center">
                        <div class="flex flex-col">
                            <span class="font-label-sm text-label-sm text-on-surface-variant">Est. Expiry</span>
                            <span class="font-label-md text-label-md text-on-surface">${item.estimated_expiry_days ? item.estimated_expiry_days + ' Days' : 'N/A'}</span>
                        </div>
                        <span class="font-title-lg text-title-lg text-primary">${item.quantity} ${item.unit}</span>
                    </div>
                </article>
            `).join('');
        } catch (err) {
            gridEl.innerHTML = '<div class="col-span-full py-12 text-center text-error font-body-md">Unable to connect to backend server.</div>';
        }
    }

    function filterCategory(cat, btn) {
        activeCategory = cat;
        document.querySelectorAll('.category-btn').forEach(b => {
            b.className = 'category-btn px-4 py-2 rounded-full border border-surface-variant text-on-surface-variant hover:bg-surface-container font-label-md text-label-md whitespace-nowrap transition-colors';
        });
        btn.className = 'category-btn px-4 py-2 rounded-full border-[1.5px] border-primary text-primary font-label-md text-label-md whitespace-nowrap bg-primary/5';
        loadInventory();
    }

    function handleSearchInput(val) {
        activeSearch = val;
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            loadInventory();
        }, 300);
    }

    requireAuth().then(() => {
        loadInventory();
    });
</script>

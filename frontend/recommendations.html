<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshCheck - Recommendations</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
                  url('https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=1920&q=80') center/cover fixed no-repeat;
      min-height: 100vh;
      color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    .dashboard-layout {
      display: flex;
      flex: 1;
      min-height: calc(100vh - 54px);
    }

    /* Sidebar */
    aside {
      width: 250px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid rgba(255, 255, 255, 0.15);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.25rem;
      color: #ffffff;
      text-decoration: none;
      margin-bottom: 28px;
      padding-left: 8px;
    }

    .logo i { color: #22c55e; font-size: 1.4rem; }

    .nav-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item a {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      color: #d1d5db;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .nav-item a:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .nav-item.active a {
      background: #15803d;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(21, 128, 61, 0.3);
    }

    .nav-item a i { font-size: 1.05rem; width: 20px; text-align: center; }

    .badge-count {
      background-color: #ef4444;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 12px;
      margin-left: auto;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #22c55e;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .user-info h4 { font-size: 0.88rem; color: #ffffff; }
    .user-info p { font-size: 0.74rem; color: #9ca3af; }

    /* Main Container */
    main {
      flex: 1;
      padding: 30px 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
    }

    /* Glassmorphism Card Modal Container */
    .glass-modal {
      width: 100%;
      max-width: 920px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    /* Filter Pills */
    .filter-pills {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 16px;
    }

    .pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #d1d5db;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    .pill.active {
      background: #22c55e;
      color: #ffffff;
      border-color: #22c55e;
      font-weight: 600;
    }

    /* List Container */
    .item-list {
      display: flex;
      flex-direction: column;
    }

    /* Individual List Row */
    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      transition: background 0.2s;
    }

    .item-row:last-child {
      border-bottom: none;
    }

    .item-row:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Round Circle Avatars */
    .circle-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: #ffffff;
      flex-shrink: 0;
    }

    .circle-avatar.fresh { background: #22c55e; }
    .circle-avatar.warning { background: #f59e0b; }
    .circle-avatar.alert { background: #ef4444; }

    .item-details h4 {
      font-size: 0.98rem;
      font-weight: 600;
      color: #ffffff;
      text-transform: lowercase;
    }

    .item-details h4::first-letter {
      text-transform: uppercase;
    }

    .item-details p {
      font-size: 0.82rem;
      color: #9ca3af;
      margin-top: 3px;
    }

    .item-right-status {
      font-size: 0.88rem;
      color: #9ca3af;
      font-weight: 500;
    }

    footer {
      background-color: #1a2a22;
      color: #9ca3af;
      padding: 15px 8%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 0.85rem;
    }

    .footer-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-item i { color: #22c55e; }
  </style>
</head>
<body>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside>
      <div class="sidebar-top">
        <a href="index.html" class="logo">
          <i class="fa-solid fa-leaf"></i> FreshCheck
        </a>

        <ul class="nav-menu">
          <li class="nav-item">
            <a href="Dashboard.html"><i class="fa-solid fa-table-cells-large"></i> Dashboard</a>
          </li>
          <li class="nav-item">
            <a href="add-food.html"><i class="fa-solid fa-plus"></i> Add Food</a>
          </li>
          <li class="nav-item">
            <a href="inventory.html"><i class="fa-solid fa-box-archive"></i> Inventory</a>
          </li>
          <li class="nav-item">
            <a href="analytics.html"><i class="fa-solid fa-chart-column"></i> Analytics</a>
          </li>
          <li class="nav-item">
            <a href="notifications.html">
              <i class="fa-regular fa-bell"></i> Notifications
              <span class="badge-count">1</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="reports.html"><i class="fa-regular fa-file-lines"></i> Reports</a>
          </li>
          <li class="nav-item active">
            <a href="recommendations.html"><i class="fa-solid fa-lightbulb"></i> Recommendations</a>
          </li>
          <li class="nav-item">
            <a href="profile.html"><i class="fa-regular fa-user"></i> Profile</a>
          </li>
          <li class="nav-item">
            <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
          </li>
          <li class="nav-item">
            <a href="logout.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
          </li>
        </ul>
      </div>

      <div class="user-profile">
        <div class="avatar" id="userAvatar">U</div>
        <div class="user-info">
          <h4 id="userName">User Name</h4>
          <p id="userContact">user@example.com</p>
        </div>
      </div>
    </aside>

    <!-- Main View -->
    <main>
      <div class="glass-modal">
        <!-- Filter Tabs -->
        <div class="filter-pills">
          <button class="pill active" onclick="filterItems('all', this)">All</button>
          <button class="pill" onclick="filterItems('alerts', this)">Alerts</button>
          <button class="pill" onclick="filterItems('warnings', this)">Warnings</button>
          <button class="pill" onclick="filterItems('information', this)">Information</button>
        </div>

        <!-- Recommendations Container List -->
        <div class="item-list" id="recommendationsContainer">
          <p style="color: #9ca3af; font-size: 0.88rem; padding: 10px;">Loading items...</p>
        </div>
      </div>
    </main>
  </div>

  <footer>
    <div class="footer-item"><i class="fa-solid fa-shield-halved"></i> <span>Trusted by Thousands</span></div>
    <div class="footer-item"><i class="fa-solid fa-bullseye"></i> <span>Accurate Predictions</span></div>
    <div class="footer-item"><i class="fa-solid fa-heart"></i> <span>Healthy Future</span></div>
  </footer>
<script src="auth-check.js"></script>
  <script src="recommendations.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fresh Monitor - Phone & Alternative Login</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
                  url('https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
    }

    /* Header Navbar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 8%;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
      color: #4ade80;
      text-decoration: none;
    }

    .logo span {
      color: #ffffff;
      display: block;
      font-size: 0.75rem;
      letter-spacing: 1.5px;
    }

    .btn-back {
      color: #e5e7eb;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.3s;
    }

    .btn-back:hover {
      color: #4ade80;
    }

    /* Centered Login Container */
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    /* Glassmorphism Card */
    .login-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 35px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .login-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 12px;
      background: rgba(0, 0, 0, 0.2);
    }

    .login-header h2 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .login-header p {
      font-size: 0.88rem;
      color: #d1d5db;
    }
/* Divider Line */
.social-divider {
  display: flex;
  align-items: center;
  text-align: center;
  margin: 24px 0 18px 0;
}

.social-divider::before,
.social-divider::after {
  content: '';
  flex: 1;
  border-bottom: 1px solid rgba(255, 255, 255, 0.15);
}

.social-divider span {
  padding: 0 12px;
  font-size: 0.72rem;
  font-weight: 600;
  color: #9ca3af;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

/* Social Buttons Container */
.social-btn-group {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}

/* Glassmorphism Social Buttons */
.btn-social {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 12px;
  color: #ffffff;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.3s, border-color 0.3s, transform 0.2s;
}

.btn-social:hover {
  background: rgba(255, 255, 255, 0.15);
  border-color: rgba(255, 255, 255, 0.4);
  transform: translateY(-2px);
}

.btn-social i {
  font-size: 1.1rem;
}
    /* Form Elements */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: #e5e7eb;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      color: #9ca3af;
      font-size: 0.9rem;
    }

    .input-wrapper input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.3s, background 0.3s;
    }

    .input-wrapper input::placeholder {
      color: #9ca3af;
    }

    .input-wrapper input:focus {
      border-color: #4ade80;
      background: rgba(255, 255, 255, 0.15);
    }

    /* Inline Action Button for SMS OTP */
    .btn-inline {
      position: absolute;
      right: 6px;
      background: rgba(74, 222, 128, 0.2);
      border: 1px solid #4ade80;
      color: #4ade80;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-inline:hover {
      background: #4ade80;
      color: #111827;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      margin-bottom: 20px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #d1d5db;
      cursor: pointer;
    }

    .remember-me input {
      accent-color: #4ade80;
      cursor: pointer;
    }

    /* Updated Forgot Password Link */
    .forgot-pass {
      color: #4ade80;
      text-decoration: none;
      font-weight: 500;
      transition: text-decoration 0.3s;
    }

    .forgot-pass:hover {
      text-decoration: underline;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background-color: #4ade80;
      color: #111827;
      padding: 11px;
      border: none;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.3s;
    }

    .btn-submit:hover {
      background-color: #22c55e;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #9ca3af;
      font-size: 0.8rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .divider span {
      padding: 0 10px;
    }

    /* Alternative Logins (Socials & Magic Link) */
    .social-logins {
      display: flex;
      gap: 10px;
    }

    .btn-social {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #ffffff;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: background 0.3s;
    }

    .btn-social:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Switch to Email Login */
    .email-switch {
      text-align: center;
      font-size: 0.85rem;
      color: #d1d5db;
      margin-top: 20px;
    }

    .email-switch a {
      color: #4ade80;
      text-decoration: none;
      font-weight: 600;
    }

    .email-switch a:hover {
      text-decoration: underline;
    }

    /* Footer Bar */
    footer {
      background-color: #1a2a22;
      color: #9ca3af;
      padding: 15px 8%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 0.85rem;
    }

    .footer-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-item i {
      color: #4ade80;
    }
  </style>
</head>
<body>

  <!-- Header Navbar -->
  <header>
    <a href="index.html.html" class="logo">
      <i class="fa-solid fa-leaf"></i>
      <div>
        FRESH
        <span>MONITOR</span>
      </div>
    </a>
    <a href="forgotpass.html" class="btn-back">
      <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>
  </header>

  <!-- Login Container -->
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="badge">
          <i class="fa-solid fa-mobile-screen-button"></i> PHONE LOGIN
        </div>
        <h2>Sign In with Phone</h2>
        <p>Use your registered mobile number to log in</p>
      </div>

      <form action="#" method="POST">
        <!-- Phone Number Input -->
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-phone"></i>
            <input type="tel" id="phone" placeholder="+1 (555) 000-0000" required />
            <button type="button" class="btn-inline">Send OTP</button>
          </div>
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <label for="password">Password or OTP Code</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Enter password or 6-digit OTP" required />
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" />
            Remember me
          </label>
          <!-- Updated Forgot Password Redirect Option -->
          <a href="Another Way.html" class="forgot-pass">Reset Here</a>
        </div>

        <button type="submit" class="btn-submit">
          Log In <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <!-- Alternative Methods -->
      <div class="divider">
        <span>OR CONTINUE WITH</span>
      </div>
<!-- SOCIAL LOGIN BUTTONS -->
<div class="social-btn-group">
  <button type="button" class="btn-social" id="googleLoginBtn">
    <i class="fa-brands fa-google"></i> Google
  </button>
  <button type="button" class="btn-social" id="appleLoginBtn">
    <i class="fa-brands fa-apple"></i> Apple
  </button>
</div>
      <div class="email-switch">
        Prefer using Email? <a href="signin.html.html">Log in with Email</a>
      </div>
    </div>
  </div>

  <!-- Footer Bar -->
  <footer>
    <div class="footer-item">
      <i class="fa-solid fa-shield-halved"></i>
      <span>Trusted by Thousands</span>
    </div>
    <div class="footer-item">
      <i class="fa-solid fa-bullseye"></i>
      <span>Accurate Predictions</span>
    </div>
    <div class="footer-item">
      <i class="fa-solid fa-heart"></i>
      <span>Healthy Future</span>
    </div>
  </footer>

</body>
</html>

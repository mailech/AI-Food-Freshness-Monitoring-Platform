version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: freshlens-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freshlens_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-freshlens_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: freshlens-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-mongo_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-mongo_password}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-freshlens_mongo}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freshlens-backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-your_secure_secret_key}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-freshlens_db}
      - MONGODB_URL=mongodb://${MONGODB_USER:-mongo_admin}:${MONGODB_PASSWORD:-mongo_password}@mongodb:27017/${MONGODB_DB:-freshlens_mongo}?authSource=admin
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: freshlens-frontend
    ports:
      - "3000:3000"
    environment:
      - DOCKER_ENV=true
    depends_on:
      - backend

volumes:
  postgres_data:
  mongodb_data:

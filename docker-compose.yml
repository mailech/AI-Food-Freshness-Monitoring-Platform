version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: freshlens-postgres
    environment:
      POSTGRES_DB: freshlens_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freshlens_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: freshlens-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
      MONGO_INITDB_DATABASE: freshlens_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freshlens-backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=freshlens_secret_key_for_development_purposes_only
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_password@postgres:5432/freshlens_db
      - MONGODB_URL=mongodb://mongo_admin:mongo_password@mongodb:27017/freshlens_mongo?authSource=admin
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: freshlens-frontend
    ports:
      - "3000:3000"
    environment:
      - DOCKER_ENV=true
    depends_on:
      - backend

volumes:
  postgres_data:
  mongodb_data:

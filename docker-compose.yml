version: '3.8'

services:
  # 1. PostgreSQL DB
  db:
    image: postgres:15-alpine
    container_name: fresh_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: food_freshness_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql

  # 2. MongoDB Document Store
  mongo:
    image: mongo:6.0
    container_name: fresh_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/init_mongo.js:/docker-entrypoint-initdb.d/init_mongo.js:ro

  # 3. Redis Message Broker
  redis:
    image: redis:7-alpine
    container_name: fresh_redis
    restart: always
    ports:
      - "6379:6379"

  # 4. FastAPI Backend Application
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: fresh_backend
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: food_freshness_db
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super-secret-key-for-food-freshness-platform-2026
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - db
      - mongo
      - redis

  # 5. Celery Async Task Worker
  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: fresh_worker
    restart: always
    command: celery -A backend.celery_app.celery_app worker --loglevel=info
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: food_freshness_db
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
      - db

  # 6. Nginx React Frontend Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: fresh_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
  uploads_data:

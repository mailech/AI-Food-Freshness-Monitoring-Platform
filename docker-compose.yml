services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: foodfresh-backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend/uploads:/app/uploads

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: foodfresh-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped
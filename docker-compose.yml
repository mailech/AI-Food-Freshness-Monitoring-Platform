services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: foodfreshness-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/food_history.db:/app/food_history.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodfreshness-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    
[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
filterwarnings =
    ignore::DeprecationWarning:starlette.testclient
    ignore::DeprecationWarning:reportlab.*
markers =
    slow: tests that run the full ML pipeline or generate reports

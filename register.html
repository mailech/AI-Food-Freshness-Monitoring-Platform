<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - FoodFresh AI</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body class="auth-body">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                🥬
            </div>

            <h1>
                Create Account
            </h1>

            <p class="auth-subtitle">
                Register for FoodFresh AI
            </p>

            <form id="registerForm">

                <div class="form-group">

                    <label for="registerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="primary-btn auth-btn"
                >
                    Create Account
                </button>

                <p
                    id="registerMessage"
                    class="auth-message">
                </p>

            </form>

            <div class="auth-footer">

                <p>
                    Already have an account?
                </p>

                <a href="index.html">
                    Login here
                </a>

            </div>

        </div>

    </div>

    <!-- ONLY script.js -->
    <script src="script.js"></script>

</body>

</html>
